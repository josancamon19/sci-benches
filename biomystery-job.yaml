jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0

environment:
  type: daytona
  force_build: false
  delete: true

verifier:
  disable: false
  env:
    CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"

artifacts:
  - source: /app
    destination: workspace
    exclude:
      - data_files

agents:
  - name: claude-code
    model_name: anthropic/claude-opus-4-8
    extra_allowed_hosts:
      - api.anthropic.com
    env:
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"
      CLAUDE_FORCE_OAUTH: "${CLAUDE_FORCE_OAUTH:-YES}"

datasets:
  - path: datasets/biomystery-bench-full
    task_names:
      - hb002
