jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 4
timeout_multiplier: 1.0
retry:
  max_retries: 2
  include_exceptions:
    - NetworkConnectionError

environment:
  type: daytona
  force_build: false
  delete: true

verifier:
  disable: false

artifacts:
  - source: /app
    destination: workspace
    exclude:
      - data_files

agents:
  - name: claude-code
    model_name: anthropic/claude-opus-4-8
    extra_allowed_hosts:
      - api.anthropic.com
    env:
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"
      CLAUDE_FORCE_OAUTH: "${CLAUDE_FORCE_OAUTH:-YES}"

  - import_path: shared.agents.bio_research_claude_code:BioResearchClaudeCode
    model_name: anthropic/claude-opus-4-8
    extra_allowed_hosts:
      - api.anthropic.com
      - pubmed.mcp.claude.com
      - mcp.services.biorender.com
      - hcls.mcp.claude.com
      - mcp.consensus.app
      - mcp.synapse.org
      - connector.scholargateway.ai
      - mcp.k.owkin.com
      - mcp.platform.opentargets.org
    kwargs:
      instruction_prefix: >-
        Before solving the task, explore the available Bio Research plugin skills
        and connected MCP tools by invoking the bio-research:start skill. Use any
        relevant plugin capability if it can help.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"
      CLAUDE_FORCE_OAUTH: "${CLAUDE_FORCE_OAUTH:-YES}"

datasets:
  - path: datasets/biomystery-bench
    task_names:
      - hb002
      - hb010
