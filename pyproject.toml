[project]
name = "genebench-pro"
version = "0.1.0"
description = "Harbor adapter for the public GeneBench-Pro benchmark package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor[daytona]==0.20.0",
    "huggingface-hub==1.26.0",
    "jinja2==3.1.6",
    "pypdf==6.14.2",
    "python-dotenv==1.2.2",
]

[project.scripts]
biomystery-bench-adapter = "biomistery_bench.main:main"
compbiobench-adapter = "compbiobench.main:main"
drug-discovery-bench-adapter = "drug_discovery_bench.main:main"
epibench-adapter = "epibench.main:main"
genebench-pro-adapter = "genebench_pro.main:main"
txbench-pp-adapter = "txbench_pp.main:main"

[build-system]
requires = ["uv-build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.uv.build-backend]
module-name = ["genebench_pro", "biomistery_bench", "compbiobench", "drug_discovery_bench", "epibench", "txbench_pp", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
