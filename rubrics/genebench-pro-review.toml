# Derived from GeneBench-Pro Tables 1 and 2 and the External Scientific Review section.
# The public case-study report is verifier-only evidence at task/tests/report_public.txt.

[[criteria]]
name = "recoverable_realized_target"
description = "Is the graded target recoverable from the realized agent-visible data rather than a hidden data-generating parameter?"
guidance = "Read task/instruction.md, task/tests/eval_config.json, task/tests/report_public.txt, the grader, and the trial trajectory. PASS when the ground truth is a finite-sample or otherwise realized-data target that a correct analysis can recover from the staged files. FAIL when grading depends on an unobservable DGP parameter, hidden nuisance specification, or unavailable evidence. Use NOT_APPLICABLE only when the supplied materials do not contain enough evidence to adjudicate this criterion; do not infer DGP validity from a passing reward alone."

[[criteria]]
name = "unique_identifiable_estimand"
description = "Do the prompt and staged evidence identify one defensible graded estimand without relying on a hidden preferred pipeline?"
guidance = "Check whether units, population, conditioning set, time origin, orientation or polarity, target fields, and any finite-sample definition needed for grading are solver-visible. PASS when alternate interpretations are ruled out by the prompt or empirical constraints while the workflow itself remains non-prescriptive. FAIL when success requires guessing an unstated pipeline, label convention, causal target, or nuisance definition. Explicitly consider the paper's underspecified-estimand and non-identifiable-phasing findings."

[[criteria]]
name = "defensible_alternative_methods"
description = "Does grading tolerate scientifically defensible alternative implementations and nearby analyst choices?"
guidance = "Compare the answer contract, grader tolerances, public report sensitivity analyses, and the agent's chosen method. PASS when equivalent estimators, posterior-weighted versus hard-call summaries, reasonable QC thresholds, numerical solvers, and implementation-level variation either remain accepted or are scientifically ruled out by solver-visible evidence. FAIL when a defensible method would be rejected merely because it differs from an undisclosed reference workflow. Use NOT_APPLICABLE when no meaningful method or threshold alternatives exist."

[[criteria]]
name = "method_and_dgp_parity"
description = "Do the named scientific method, reference workflow, simulator, ground truth, and validator implement the same estimand correctly?"
guidance = "Use task/tests/report_public.txt, eval_config.json, reference_grader.py, and any agent implementation to check method parity. Look for the paper's failure modes such as presenting an ad hoc estimator as LDSC, using the wrong weighting or denominator, exposing the wrong parameter, or validating against equations inconsistent with the simulator. PASS when the reference and grading implementation match the named method and realized target. FAIL on a substantive implementation mismatch. Use NOT_APPLICABLE only when no named or mathematically constrained method is involved."

[[criteria]]
name = "solver_visible_evidence_consistency"
description = "Are assay evidence, labels, phase, scale, nuisance variables, and QC rules sufficiently visible and internally consistent?"
guidance = "Inspect the prompt, staged-file descriptions in the report, grader contract, and trajectory. PASS when the solver can resolve relevant scale and orientation, harmonization, phase or polarity, copy-number or purity context, selection or censoring, batch or latent groups, and the QC-valid sample set. FAIL when private/reference materials resolve a contradiction that solver-facing materials do not, or when conflicting assays lack a stated hierarchy. Apply the paper's SV-driven activation, long-read-only phasing, and donor-specific phase examples as general patterns rather than task-specific requirements."

[[criteria]]
name = "qc_and_ablation_robustness"
description = "Do validation and grading separate the intended workflow from plausible wrong shortcuts without depending on arbitrary QC cutoffs?"
guidance = "Read the validation, sensitivity, and ablation sections of task/tests/report_public.txt and compare them with grader tolerances and the trajectory. PASS when plausible wrong analyses miss by clear margins, nearby reasonable QC thresholds preserve the graded outcome, and shortcut routes do not accidentally pass. FAIL when wrong analyses can pass, correct nearby choices can fail, or answer separation is unsupported. Use NOT_APPLICABLE if the public evidence contains no relevant QC, sensitivity, or ablation claim."

[[criteria]]
name = "simulation_realism_and_leakage"
description = "Is the problem fully simulated yet presented as a realistic scientific analysis without answer leakage or dependence on external data?"
guidance = "Use task/tests/report_public.txt and the complete task tree to assess provenance and realism. PASS when solver inputs and ground truth come from a documented simulation or controlled construction, staged files resemble plausible assay or clinical-system exports, all necessary evidence is local, and filenames, metadata, instructions, or artifacts do not reveal the answer or reference pipeline. FAIL when grading relies on external or private data, real participant data is presented as simulated, the nuisance structure is scientifically contrived without justification, or a shortcut leaks the target. Use NOT_APPLICABLE only when provenance cannot be established from the supplied evidence."

[[criteria]]
name = "multistage_workflow_fidelity"
description = "Does the task and trial exercise a realistic chain of dependent scientific decisions rather than one isolated trick or a leaked shortcut?"
guidance = "Identify the substantive inferential forks documented in the report and actually encountered in the trajectory: filtering, representation, diagnostic interpretation, model or estimator choice, and final decision. PASS when multiple upstream choices materially affect the endpoint and the agent propagates diagnostic findings into later actions. FAIL when the apparent complexity collapses to one arbitrary trick, the agent obtains the answer through leaked reference material or grader manipulation, or the setup is scientifically contrived. A legitimate failed attempt can still PASS task fidelity if it engages the intended chain."

[[criteria]]
name = "prompt_grader_alignment"
description = "Do the solver-facing answer contract and grading implementation evaluate exactly the stated scientific target?"
guidance = "Compare task/instruction.md with task/tests/eval_config.json, reference_grader.py, verifier output, and the submitted result. PASS when required keys, types, units, polarity, numerical ranges, tolerances, and reasoning requirements match and binary reward reflects all graded fields. FAIL on hidden fields, mismatched units or labels, ambiguous validator targets, response-format traps unrelated to the science, or grader behavior inconsistent with the prompt."
