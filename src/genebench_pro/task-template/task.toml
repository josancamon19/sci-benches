schema_version = "1.4"

[task]
name = {{ package_name | tojson }}
version = "1.0.0"
description = {{ title | tojson }}
authors = [{ name = "GeneBench-Pro authors" }]
keywords = ["biology", "genomics", "scientific-reasoning", "data-analysis"]

[metadata]
difficulty = "hard"
category = "scientific-data-analysis"
tags = ["biology", "genomics", "genebench-pro"]
upstream_eval_id = {{ task_id | tojson }}
upstream_eval_uuid = {{ eval_uuid | tojson }}
upstream_domain = {{ domain | tojson }}
upstream_revision = {{ source_revision | tojson }}

[agent]
network_mode = "no-network"
timeout_sec = 3600.0

[verifier]
network_mode = "no-network"
timeout_sec = 120.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
